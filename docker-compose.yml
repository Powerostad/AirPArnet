version: '3.7'
services:
  mysql:
    image: focker.ir/mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - '3307:3306'
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      retries: 5
#    volumes:
#      - ./mysql:/var/lib/mysql:cached

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    command: python app/main.py
    tty: true
    volumes:
      - ./backend:/app/:cached
      - ./.docker/.ipython:/root/.ipython:cached
    ports:
      - '8010:8000'
    environment:
      PYTHONPATH: .
      DATABASE_URL: 'mysql://myuser:mypassword@172.17.0.1:3306/mydatabase'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  db-data:
